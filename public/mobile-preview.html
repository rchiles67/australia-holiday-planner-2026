<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile preview — Drift Australia 2026</title>
    <style>
      :root {
        color: #eef5f2;
        background: #172722;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 430px;
        min-height: 100vh;
        margin: 0;
        padding: 18px;
        display: grid;
        place-items: start center;
        background: #172722;
      }

      .preview-shell {
        width: 414px;
        padding: 10px 12px 14px;
        border: 1px solid #4b625b;
        border-radius: 24px;
        background: #0f1d19;
        box-shadow: 0 18px 50px rgb(0 0 0 / 35%);
      }

      .preview-label {
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 5px;
        color: #b9cbc5;
        font-size: 11px;
        letter-spacing: .04em;
      }

      .preview-label strong {
        color: #f6faf8;
        font-weight: 650;
      }

      iframe {
        width: 390px;
        height: 844px;
        display: block;
        border: 0;
        border-radius: 15px;
        background: white;
      }
    </style>
  </head>
  <body>
    <main class="preview-shell">
      <div class="preview-label"><strong>Mobile preview</strong><span>390 × 844</span></div>
      <iframe src="./" title="Australia holiday planner — mobile preview"></iframe>
    </main>
  </body>
</html>
